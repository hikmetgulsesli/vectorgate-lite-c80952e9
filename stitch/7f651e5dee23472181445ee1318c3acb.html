<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Gameplay - VectorGate Lite</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Geist:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-primary": "#00696e",
                        "on-error-container": "#ffdad6",
                        "inverse-on-surface": "#313030",
                        "error": "#ffb4ab",
                        "surface-bright": "#3a3939",
                        "outline": "#849495",
                        "surface-tint": "#00dce5",
                        "surface-container-low": "#1c1b1b",
                        "tertiary-fixed-dim": "#2ae500",
                        "on-primary": "#003739",
                        "secondary-fixed-dim": "#ffabf3",
                        "primary-fixed-dim": "#00dce5",
                        "primary-fixed": "#63f7ff",
                        "surface-container-lowest": "#0e0e0e",
                        "on-secondary-fixed-variant": "#810081",
                        "surface": "#131313",
                        "surface-container-highest": "#353534",
                        "surface-container": "#201f1f",
                        "on-surface-variant": "#b9caca",
                        "on-background": "#e5e2e1",
                        "on-surface": "#e5e2e1",
                        "background": "#131313",
                        "secondary-fixed": "#ffd7f5",
                        "on-secondary-fixed": "#380038",
                        "surface-variant": "#353534",
                        "on-primary-fixed-variant": "#004f53",
                        "tertiary-fixed": "#79ff5b",
                        "on-secondary": "#5b005b",
                        "on-primary-container": "#006c71",
                        "on-tertiary": "#053900",
                        "primary": "#e9feff",
                        "on-tertiary-fixed-variant": "#095300",
                        "tertiary-container": "#3bff17",
                        "secondary": "#ffabf3",
                        "on-primary-fixed": "#002021",
                        "on-tertiary-container": "#107100",
                        "secondary-container": "#fe00fe",
                        "on-error": "#690005",
                        "error-container": "#93000a",
                        "inverse-surface": "#e5e2e1",
                        "tertiary": "#efffe4",
                        "primary-container": "#00f5ff",
                        "outline-variant": "#3a494a",
                        "on-secondary-container": "#500050",
                        "on-tertiary-fixed": "#022100",
                        "surface-container-high": "#2a2a2a",
                        "surface-dim": "#131313"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "container-padding": "24px",
                        "gutter": "12px",
                        "hud-safe-area": "32px"
                    },
                    "fontFamily": {
                        "headline-md": ["Space Grotesk"],
                        "label-sm": ["Geist"],
                        "body-md": ["Geist"],
                        "display-lg": ["Space Grotesk"],
                        "display-xl": ["Space Grotesk"],
                        "body-lg": ["Geist"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "display-xl": ["72px", { "lineHeight": "80px", "letterSpacing": "-0.04em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #0A0A0A;
            overflow: hidden;
        }
        .bg-grid {
            background-image: 
                linear-gradient(to right, rgba(0, 220, 229, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 220, 229, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center center;
        }
        .neon-glow-primary { text-shadow: 0 0 10px rgba(0, 220, 229, 0.8), 0 0 20px rgba(0, 220, 229, 0.4); }
        .neon-box-primary { box-shadow: 0 0 15px rgba(0, 220, 229, 0.3), inset 0 0 10px rgba(0, 220, 229, 0.2); }
        .neon-glow-secondary { text-shadow: 0 0 10px rgba(255, 171, 243, 0.8), 0 0 20px rgba(255, 171, 243, 0.4); }
        .neon-glow-tertiary { text-shadow: 0 0 10px rgba(59, 255, 23, 0.8), 0 0 20px rgba(59, 255, 23, 0.4); }
        
        .scanline {
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 4px;
        }
        
        @keyframes rotate-gate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        @keyframes rotate-gate-reverse {
            from { transform: translate(-50%, -50%) rotate(360deg); }
            to { transform: translate(-50%, -50%) rotate(0deg); }
        }
        @keyframes pulse-signal {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; box-shadow: 0 0 20px rgba(0, 220, 229, 1); }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.8; box-shadow: 0 0 40px rgba(0, 220, 229, 0.8); }
        }
        @keyframes score-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .gate-outer { animation: rotate-gate 8s linear infinite; }
        .gate-inner { animation: rotate-gate-reverse 5s linear infinite; }
        .signal-core { animation: pulse-signal 0.5s ease-in-out infinite; }
        .score-active { animation: score-pulse 0.4s ease-in-out infinite; }
    </style>
</head>
<body class="relative w-full h-screen font-body-md text-on-background selection:bg-primary-container selection:text-on-primary-container">
<!-- Playfield Canvas (Background) -->
<div class="absolute inset-0 bg-grid z-0"></div>
<!-- Playfield Elements (Center) -->
<div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] z-10 pointer-events-none">
<!-- Gate 1 (Outer - Magenta) -->
<div class="gate-outer absolute top-1/2 left-1/2 w-[500px] h-[500px] border-[4px] border-secondary border-dashed rounded-full opacity-60 filter blur-[1px]" style="box-shadow: 0 0 30px rgba(255, 171, 243, 0.3) inset, 0 0 30px rgba(255, 171, 243, 0.3);"></div>
<!-- Gate 2 (Inner - Lime) -->
<div class="gate-inner absolute top-1/2 left-1/2 w-[300px] h-[300px] border-[6px] border-tertiary-container border-dotted rounded-full opacity-80" style="box-shadow: 0 0 20px rgba(59, 255, 23, 0.4) inset, 0 0 20px rgba(59, 255, 23, 0.4);"></div>
<!-- Player Signal (Center - Cyan) -->
<div class="signal-core absolute top-1/2 left-1/2 w-6 h-6 bg-primary rounded-full z-20"></div>
<!-- Signal Trail/Motion -->
<div class="absolute top-1/2 left-1/2 w-20 h-1 bg-gradient-to-l from-primary to-transparent transform -translate-y-1/2 -translate-x-full opacity-50 filter blur-[2px]"></div>
</div>
<!-- HUD: TopAppBar (Shared Component Base) -->
<nav class="flex justify-between items-start px-hud-safe-area pt-hud-safe-area w-full z-50 absolute top-0 left-0 pointer-events-none">
<!-- Left HUD: Brand & Level -->
<div class="flex flex-col gap-2 bg-surface/60 backdrop-blur-xl border border-primary/20 shadow-[0_0_15px_rgba(0,220,229,0.3)] rounded-lg p-4 pointer-events-auto scanline relative overflow-hidden">
<div class="absolute inset-0 border border-t-0 border-l-0 border-r-0 border-b-primary opacity-50" style="background: linear-gradient(to top right, transparent, rgba(0, 220, 229, 0.1));"></div>
<h1 class="font-display-lg text-primary tracking-tighter uppercase leading-none neon-glow-primary relative z-10">VectorGate Lite</h1>
<div class="flex items-center gap-2 relative z-10">
<span class="font-label-sm text-label-sm uppercase tracking-widest text-on-surface-variant">Sector</span>
<span class="font-headline-md text-headline-md text-tertiary-container neon-glow-tertiary">03</span>
</div>
</div>
<!-- Center HUD: Health Bar (Progress Bar Component) -->
<div class="flex flex-col items-center gap-2 mt-4 pointer-events-auto">
<span class="font-label-sm text-label-sm uppercase tracking-widest text-on-surface-variant">Shield Integrity</span>
<div class="flex gap-1 w-64 h-3 bg-surface-container-highest border border-outline-variant p-[2px]">
<!-- Segmented Health -->
<div class="h-full w-1/5 bg-tertiary-container shadow-[0_0_10px_rgba(59,255,23,0.8)]"></div>
<div class="h-full w-1/5 bg-tertiary-container shadow-[0_0_10px_rgba(59,255,23,0.8)]"></div>
<div class="h-full w-1/5 bg-tertiary-container shadow-[0_0_10px_rgba(59,255,23,0.8)]"></div>
<div class="h-full w-1/5 bg-tertiary-container shadow-[0_0_10px_rgba(59,255,23,0.8)]"></div>
<!-- Empty Segment -->
<div class="h-full w-1/5 bg-surface-container border border-outline-variant/30"></div>
</div>
<span class="font-headline-md text-headline-md text-tertiary-container neon-glow-tertiary">80%</span>
</div>
<!-- Right HUD: Score & Actions -->
<div class="flex flex-col items-end gap-4 pointer-events-auto">
<!-- Score Multiplier & Score -->
<div class="flex flex-col items-end score-active">
<span class="font-label-sm text-label-sm uppercase tracking-widest text-secondary neon-glow-secondary">x4 Multiplier</span>
<span class="font-display-xl text-display-xl text-primary neon-glow-primary tabular-nums tracking-wider">001250</span>
</div>
<!-- Trailing Icons (Shared Component Logic) -->
<div class="flex gap-4">
<button class="w-10 h-10 flex items-center justify-center border border-primary text-primary hover:bg-primary/20 hover:text-primary transition-all duration-150 scale-95 active:scale-90 bg-surface/60 backdrop-blur-md rounded group relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-tr from-primary/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">settings</span>
</button>
<button class="w-10 h-10 flex items-center justify-center border border-primary text-primary hover:bg-primary/20 hover:text-primary transition-all duration-150 scale-95 active:scale-90 bg-surface/60 backdrop-blur-md rounded group relative overflow-hidden" title="Pause (Esc)">
<div class="absolute inset-0 bg-gradient-to-tr from-primary/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">pause</span>
<div class="absolute -bottom-6 right-0 font-label-sm text-[10px] text-on-surface-variant uppercase whitespace-nowrap opacity-50">Esc</div>
</button>
</div>
</div>
</nav>
<!-- Bottom HUD: Session Info -->
<div class="absolute bottom-hud-safe-area left-hud-safe-area right-hud-safe-area flex justify-between items-end pointer-events-none z-50">
<!-- Left: Session Time -->
<div class="flex items-center gap-2 bg-surface/40 backdrop-blur-md border border-primary/30 p-2 rounded pointer-events-auto scanline">
<span class="material-symbols-outlined text-primary text-sm">schedule</span>
<span class="font-headline-md text-headline-md text-primary neon-glow-primary text-lg tabular-nums">02:45.33</span>
</div>
<!-- Right: High Score -->
<div class="flex flex-col items-end pointer-events-auto">
<span class="font-label-sm text-label-sm uppercase tracking-widest text-on-surface-variant mb-1">Target Score</span>
<div class="flex items-center gap-2 bg-surface/40 backdrop-blur-md border border-primary/30 p-2 rounded scanline">
<span class="material-symbols-outlined text-secondary text-sm">emoji_events</span>
<span class="font-headline-md text-headline-md text-on-surface opacity-80 text-lg tabular-nums">005000</span>
</div>
</div>
</div>
</body></html>
